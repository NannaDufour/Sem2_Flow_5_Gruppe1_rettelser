<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yo-ja</title>

    <!-- stylesheet -->
    <link rel="stylesheet" href="yoja.style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400;1,700&family=Genos:ital,wght@0,100..900;1,100..900&family=Sekuya&family=Titan+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="logoContainer">
        <a href="/sem2-flow5/index.html"
          ><img src="img/Logo.png" alt="yo-jaLogo"
        /></a>
      </div>
    </header>

    <h1>Din profil</h1>
    <!-- Profil boks m profilbillede, navn og quote-->
    <div class="profilContainer">
      <!-- flexboks-->
      <div class="profilImageContainer">
        <img src="img/templatePurple.jpeg" alt="Profilbillede" />
      </div>

      <div class="profilTextContainer">
        <p>
          SARA NIELSEN <br /><br />
          "Yoga is a life style, not a choice"
        </p>
      </div>
    </div>

    <!-- mockup af switch knap, alt efter om man vil være på sin profil eller customzize den-->
    <div class="switchContainer">
      <!-- flexboks-->
      <div class="knapFlex">
        <div class="profilKnap active">Profil</div>
        <div class="settingsKnap">Customize</div>
      </div>
    </div>

    <h2>Gemte videoer</h2>

    <!-- Gemte videoer -->
    <div class="gemteVidoerContainer">
      <img src="img/thumnail-rygfokus-rettet.png" alt="Gemte videoer" />
    </div>

    <!-- mockup af runde cirkler til at indikere at man kan swipe -->
    <div class="dotsContainerProfil">
      <span class="dot"></span>
      <span class="dot activeDot"></span>
      <span class="dot"></span>
    </div>

    <!-- Aktivitet -->
    <div class="profilWrapperOne">
      <h2>Aktivitet</h2>

      <div class="tabletGrid">
        <!-- Kalender -->
        <div class="dataContainer">
          <img src="img/pictureOfCalender.png" alt="Kalender data" />
        </div>

        <!-- Progress -->
        <div class="dataContainer">
          <img src="img/progressData.png" alt="Progress data" />
        </div>

        <!-- Statistik sektion -->
        <div class="profilWrapperTwo">
          <h2>Hvordan du har brugt din tid sammen med YO~JA</h2>

          <div class="cirkelContainer">
            <img
              src="img/cirkel-diagram-data.png"
              alt="img/Cirkeldiagram over aktivitet"
            />
          </div>
        </div>

        <!-- Venner sektion -->
        <div class="vennerSection">
          <h2>Mine venner</h2>

          <div class="vennerListeContainer">
            <div class="vennerListe">
              <img src="img/templatePurple.jpeg" alt="" />
              <h3>Tina Nielsen</h3>
              <button>Chat</button>
            </div>

            <div class="vennerListe">
              <img src="img/templatePurple.jpeg" alt="" />
              <h3>Isabella Glinnum</h3>
              <button>Chat</button>
            </div>

            <div class="vennerListe">
              <img src="img/templatePurple.jpeg" alt="" />
              <h3>Zuzanna Balas</h3>
              <button>Chat</button>
            </div>

            <div class="vennerListe">
              <img src="img/templatePurple.jpeg" alt="" />
              <h3>Nanna Dufour</h3>
              <button>Chat</button>
            </div>

            <div class="vennerListe">
              <img src="img/templatePurple.jpeg" alt="" />
              <h3>Hans Hansen</h3>
              <button>Chat</button>
            </div>

            <div class="vennerListe">
              <img src="img/templatePurple.jpeg" alt="" />
              <h3>Søren Sørensen</h3>
              <button>Chat</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer/menu -->
    <footer>
      <nav>
        <div class="menuContainer">
          <a href="/test/index.html">
            <img src="img/home.knap.png" alt="homeIcon"
          /></a>
          <!-- Hjem knap -->
          <a href="oevelser.html">
            <img src="img/video-knap.png" alt="oevelserIcon"
          /></a>
          <!-- Video knap -->
          <a href="om-yoga.html">
            <img src="img/om.os.knap.png" alt="omYogaIcon"
          /></a>
          <!-- Om Om knap -->
          <a href="profil.html">
            <img src="img/aktiv_profil.png" alt="profilIcon"
          /></a>
          <!--Profil knap-->
        </div>
      </nav>
    </footer>
  </body>
  <!-- JavaScript -->
  <script src="yoja.java.js"></script>
</html>
