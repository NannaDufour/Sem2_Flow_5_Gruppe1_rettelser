<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yo-ja</title>
    <!-- ref til stylesheet -->
    <link rel="stylesheet" href="yoja.style.css" />
    <!-- Her har vi hentet font fra google fonts - Arsenal -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400;1,700&family=Genos:ital,wght@0,100..900;1,100..900&family=Sekuya&family=Titan+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Vores header med Yo-JA logo, som fungerer som hjemmeknap også -->
    <header>
      <div class="logoContainer">
        <a href="/sem2-flow5/index.html"
          ><img src="img/Logo.png" alt="yo-jaLogo"
        /></a>
      </div>
    </header>

    <h1>Videoer</h1>

    <!-- Mockup af en knap, som sortere mellem videoer eller programmer-->
    <div class="switchContainer">
      <div class="knapFlex">
        <div class="oevelserKnap active">Videoer</div>

        <div class="programmerKnap">Programmer</div>
      </div>
    </div>

    <!-- Videoer/billeder i karusseler-->
    <h2>Smidighed</h2>

    <div class="categoryCaroussel">
      <div class="slide1">
        <section id="smidighedVideo">
          <a href="helekroppenvideo.html">
            <img
              src="img/thumnail-helekroppen-stor.png"
              alt="pictureOfVideoThumbnail"
            />
          </a>
        </section>
      </div>
      <div class="slide1">
        <img src="img/thumnail-rygfokus-rettet.png" alt="" />
      </div>
      <div class="slide1">
        <img src="img/thumnail-begynder_level_2.png" alt="" />
      </div>
      <button class="prev1">&#10094;</button>
      <!-- Knap tilbage-->
      <button class="next1">&#10095;</button>
      <!-- knap frem -->
    </div>

    <!-- Mockup af "swipe" cirkler -->
    <div class="dotsContainerOevelser">
      <span class="dot"></span>
      <span class="dot activeDot"></span>
      <span class="dot"></span>
    </div>

    <h2>Styrke</h2>

    <div class="categoryCaroussel">
      <div class="slide2">
        <section id="styrkeVideo">
          <a href="styrkevideo.html">
            <img
              src="img/thumnail-begynder_level_1.png"
              alt="pictureOfVideoThumbnail"
            />
          </a>
        </section>
      </div>
      <div class="slide2">
        <img
          src="img/thumnail-prostyrke_rettet.png"
          alt="thumbnailOfStrengthVideo"
        />
      </div>
      <div class="slide2">
        <img
          src="img/thumnail-rygfokus-rettet.png"
          alt="thumbnailOfBackVideo"
        />
      </div>
      <button class="prev2">&#10094;</button>
      <!-- Knap tilbage-->
      <button class="next2">&#10095;</button>
      <!-- knap frem -->
    </div>

    <!-- Mockup af "swipe" cirkler -->
    <div class="dotsContainerOevelser">
      <span class="dot"></span>
      <span class="dot activeDot"></span>
      <span class="dot"></span>
    </div>

    <h2>Afspænding</h2>

    <div class="categoryCaroussel">
      <div>
        <section id="afspaendingVideo">
          <a href="destressvideo.html">
            <img
              src="img/thumnail-destress_stor.png"
              alt="thumbnailOfDestressVideo"
            />
          </a>
        </section>
      </div>
    </div>

    <!-- Mockup af "swipe" cirkler -->
    <div class="dotsContainerOevelser">
      <span class="dot"></span>
      <span class="dot activeDot"></span>
      <span class="dot"></span>
    </div>

    <h2>Balance</h2>

    <div class="categoryCaroussel">
      <div>
        <section id="balanceVideo">
          <img
            src="img/thumnail-begynder_level_2.png"
            alt="thumbnailOfBeginnersVideo"
          />
        </section>
      </div>
    </div>

    <!-- Mockup af "swipe" cirkler -->
    <div class="dotsContainerOevelser">
      <span class="dot"></span>
      <span class="dot activeDot"></span>
      <span class="dot"></span>
    </div>

    <h2>Mindfulness</h2>

    <div class="categoryCaroussel">
      <div>
        <section id="mindfulnessVideo">
          <img
            src="img/thumnail-destress_stor.png"
            alt="thumbnailOfDestressVideo"
          />
        </section>
      </div>
    </div>

    <!-- Mockup af "swipe" cirkler -->
    <div class="dotsContainerOevelserFinal">
      <span class="dot"></span>
      <span class="dot activeDot"></span>
      <span class="dot"></span>
    </div>

    <!-- Footer/menu -->
    <footer>
      <nav>
        <div class="menuContainer">
          <a href="/test/index.html">
            <img src="img/home.knap.png" alt="homeIcon"
          /></a>
          <!-- Hjem knap -->
          <a href="oevelser.html">
            <img src="img/aktiv_videoer.png" alt="oevelserIcon"
          /></a>
          <!-- Video knap -->
          <a href="om-yoga.html">
            <img src="img/om.os.knap.png" alt="omYogaIcon"
          /></a>
          <!-- Om Om knap -->
          <a href="profil.html">
            <img src="img/profil-knap.png" alt="profilIcon"
          /></a>
          <!--Profil knap-->
        </div>
      </nav>
    </footer>
  </body>

  <!-- Reference til Javascript filen -->
  <script src="yoja.java.js"></script>
</html>
