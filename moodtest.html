<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yo-ja</title>
    <!-- ref til stylesheet -->
    <link rel="stylesheet" href="yoja.style.css" />
    <!-- Her har vi hentet font fra google fonts - Arsenal -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400;1,700&family=Genos:ital,wght@0,100..900;1,100..900&family=Sekuya&family=Titan+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Vores header med Yo-JA logo, som fungerer som hjemmeknap også -->
    <header>
      <div class="logoContainer">
        <a href="/test/index.html"><img src="img/Logo.png" alt="yo-jaLogo" /></a>
      </div>
    </header>

    <!-- Spørgsmål 1 - omkring humør -->
    <div class="spørgsmål aktiv">
      <h2>Hvordan har du det i dag?</h2>

      <!-- Form med radio buttons, hvor kun ét humør kan vælges -->
      <form class="formBox">
        <label class="radioBox">
          <input type="radio" name="humør" value="glad" />
          <span>Glad</span>
        </label>

        <label class="radioBox">
          <input type="radio" name="humør" value="trist" />
          <span>Trist</span>
        </label>

        <label class="radioBox">
          <input type="radio" name="humør" value="stresset" />
          <span>Stresset</span>
        </label>

        <label class="radioBox">
          <input type="radio" name="humør" value="afslappet" />
          <span>Afslappet</span>
        </label>
      </form>

      <button class="næste">Næste spørgsmål</button>
    </div>

    <!-- Spørgsmål 2 - omkring ømhed-->
    <div class="spørgsmål">
      <h2>Er du øm? Hvis ja, hvor?</h2>

      <form class="formBox">
        <label class="radioBox">
          <input type="radio" name="ømhed" value="nakke" />
          <span>Nakke</span>
        </label>

        <label class="radioBox">
          <input type="radio" name="ømhed" value="ryg" />
          <span>Ryg</span>
        </label>

        <label class="radioBox">
          <input type="radio" name="ømhed" value="skuldre" />
          <span>Skuldre</span>
        </label>

        <label class="radioBox">
          <input type="radio" name="ømhed" value="ikke-øm" />
          <span>Er ikke øm</span>
        </label>
      </form>

      <button class="næste">Næste spørgsmål</button>
    </div>

    <!-- Spørgsmål 3 - omkring stress -->
    <div class="spørgsmål">
      <h2>Har du meget at se til?</h2>

      <form class="formBox">
        <label class="radioBox">
          <input type="radio" name="stress" value="ja" />
          <span>Ja</span>
        </label>

        <label class="radioBox">
          <input type="radio" name="stress" value="nej" />
          <span>Nej</span>
        </label>
      </form>

      <button class="næste">Færdig</button>
    </div>

    <div class="spørgsmål">
      <h2>Vores anbefalede øvelse til dig</h2>

        <video controls src="video/begynderlevel1-done_2.mp4"></video>
      </div>
    </div>

   <!-- Footer/menu -->
    <footer>
      <nav>
      <div class="menuContainer">
        <a href="/test/index.html"> <img src="img/home.knap.png" alt="homeIcon" /></a>
        <!-- Hjem knap -->
        <a href="oevelser.html">
          <img src="img/video-knap.png" alt="oevelserIcon"
        /></a>
        <!-- Video knap -->
        <a href="om-yoga.html">
          <img src="img/om.os.knap.png" alt="omYogaIcon"
        /></a>
        <!-- Om Om knap -->
        <a href="profil.html">
          <img src="img/profil-knap.png" alt="profilIcon"
        /></a>
        <!--Profil knap-->
      </div>
      </nav>
    </footer>
  </body>

  <script src="yoja.java.js"></script>
</html>
